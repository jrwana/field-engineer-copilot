[project]
name = "field-engineer-copilot"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.8.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
