name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3  # no floating major tag upstream
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install
        run: uv sync --frozen

      # No network or API keys: model calls are faked, and the app test replays saved runs.
      - name: Tests
        run: uv run pytest -q
